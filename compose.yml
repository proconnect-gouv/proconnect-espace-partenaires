# Services for local development
services:
  postgresql:
    image: postgres:17.9
    environment:
      - POSTGRES_DB=proconnect_ep
      - POSTGRES_USER=usr
      - POSTGRES_PASSWORD=pwd
    healthcheck:
      interval: 1s
      timeout: 2s
      test:
        - CMD-SHELL
        - pg_isready --dbname proconnect_ep --username usr
    ports:
      - "5432:5432"

  # This MongoDB will be seeded with mock data at each restart
  mongo:
    image: mongo:5.0.23
    environment:
      - MONGO_INITDB_ROOT_USERNAME=fc_admin
      - MONGO_INITDB_ROOT_PASSWORD=pass
      - MONGO_INITDB_API_USERNAME=proconnect-app-api-partner
      - MONGO_INITDB_API_PASSWORD=pass
    healthcheck:
      interval: 1s
      test:
        - CMD-SHELL
        - echo "try { rs.status() } catch (err) { rs.initiate() }" | mongosh --username fc_admin --password pass --authenticationDatabase admin --quiet
      timeout: 2s

    ports:
      - "27017:27017"
    volumes:
      - ./docker/mongodb:/init:ro
    entrypoint: ["/init/entrypoint.sh"]
    tmpfs:
      - /data/db
      - /data/configdb

  api-partenaires:
    image: ghcr.io/proconnect-gouv/api-partenaires:sha-56cce71 # latest
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      CLIENT_SECRET_CIPHER_PASS: test-pcdbapi-secret-cipher-passs
      FEATURE_ENABLE_SANDBOX_ENDPOINT: true
      MONGODB_URI: mongodb://proconnect-app-api-partner:pass@mongo:27017/corev2?authSource=corev2&directConnection=true
      OIDC_CLIENTS_API_SECRET: pcdb-api-secret-key
      OIDC_PROVIDERS_API_SECRET: test-oidc-providers-secret
    healthcheck:
      interval: 1s
      test:
        - "CMD-SHELL"
        - "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/readyz || exit 1"
      timeout: 2s
    ports:
      - "8000:3000"
  maildev:
    image: maildev/maildev:2.2.1
    ports:
      - "1080:1080"
      - "1025:1025"
